name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "misc/**"
      - ".github/workflows/epg.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "misc/**"
      - ".github/workflows/epg.yml"
  workflow_dispatch:

# A new push to a pull request stops the run that is still going for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # The application is cross-platform, so it is built and tested on both.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache the NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore the dependencies
        run: dotnet restore BB84.IPTV.slnx

      - name: Build the solution
        run: dotnet build BB84.IPTV.slnx --configuration Release --no-restore

      - name: Run the tests
        run: dotnet test BB84.IPTV.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results
          retention-days: 7
